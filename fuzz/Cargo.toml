[package]
name = "egui-workbench-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Run with `cargo +nightly fuzz run <target>` from the repository root.
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
egui-workbench = { path = "..", default-features = false, features = ["csv", "workbook"] }
egui-workbench-host = { path = "../crates/egui-workbench-host" }

[[bin]]
name = "csv"
path = "fuzz_targets/csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "workbook"
path = "fuzz_targets/workbook.rs"
test = false
doc = false
bench = false

[[bin]]
name = "spec"
path = "fuzz_targets/spec.rs"
test = false
doc = false
bench = false

# Not a member of the root workspace.
[workspace]
