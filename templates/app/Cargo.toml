[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "{{app_title}}"
publish = false

# Standalone workspace root: keeps the app out of any parent workspace it is
# generated inside.
[workspace]

[dependencies]
# Lucide icons are embedded by name. Enable the default `material-icons`
# feature as well when the app shows file and folder names.
egui-workbench = { {% if workbench_path != "" %}path = "{{workbench_path}}", {% else %}version = "0.3", {% endif %}default-features = false, features = ["lucide-icons"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
