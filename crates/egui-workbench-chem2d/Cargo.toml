[package]
name = "egui-workbench-chem2d"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A vector 2D chemistry editor for egui-workbench: molecular graph, camera, painter, selection, and undo/redo."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
publish = false

[dependencies]
egui = "0.37"
egui-workbench-chem-core = { path = "../egui-workbench-chem-core", version = "0.1.0" }
resvg = { version = "0.48", default-features = false }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
serde_json = "1"
