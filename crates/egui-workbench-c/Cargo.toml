[package]
name = "egui-workbench-c"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "C ABI for egui-workbench: create a host from a spec, apply patches, poll events, and run it."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
publish = false

[lib]
name = "egui_workbench_c"
crate-type = ["cdylib", "staticlib"]

[dependencies]
egui-workbench-host = { path = "../egui-workbench-host", version = "0.15.0" }
serde_json = "1"
