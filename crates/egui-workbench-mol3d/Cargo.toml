[package]
name = "egui-workbench-mol3d"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A 3D molecular and crystal viewport for egui-workbench: arcball camera, scene, picking, and painter renderer."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
homepage = "https://jigonzalez930209.github.io/egui-workbench/"
documentation = "https://docs.rs/egui-workbench-mol3d"
keywords = ["chemistry", "molecule", "crystal", "3d", "egui"]
categories = ["science", "visualization", "gui"]
include = ["/src/**", "/README.md"]

[features]
default = []
gpu = ["dep:egui-wgpu", "dep:bytemuck"]

[dependencies]
egui = "0.37"
egui-workbench-chem-core = { path = "../egui-workbench-chem-core", version = "1.2.0" }
serde = { version = "1", features = ["derive"] }
egui-wgpu = { version = "0.37", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
pollster = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
serde_json = "1"
