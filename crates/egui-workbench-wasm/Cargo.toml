[package]
name = "egui-workbench-wasm"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "WebAssembly host for egui-workbench: a spec-driven canvas and the remote client."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Standalone target: the native workspace does not build the wasm bundle.
[workspace]

[dev-dependencies]
wasm-bindgen-test = "0.3"

[dependencies]
egui-workbench = { path = "../..", default-features = false, features = ["lucide-icons", "plot", "plot3d", "viewer", "serde", "ring", "channel"] }
egui = "0.37"
egui-workbench-host = { path = "../egui-workbench-host" }
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
serde_json = "1"
web-sys = { version = "0.3.103", features = [
  "CanvasRenderingContext2d",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "Window",
] }

[profile.release]
opt-level = "s"
lto = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
