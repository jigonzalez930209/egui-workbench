[package]
name = "egui-workbench-python"
version = "1.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Python bindings for egui-workbench: a native workbench from a Python script."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib", "rlib"]

[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
egui-workbench = { path = "../..", version = "1.2.0", default-features = false, features = ["serde", "plot", "plot3d", "viewer", "csv", "workbook", "ring", "channel", "lucide-icons", "arrow"] }
egui-workbench-host = { path = "../egui-workbench-host", version = "1.2.0" }
pyo3 = { version = "0.30", features = ["abi3-py39"] }
serde_json = "1"
arrow = { version = "60", default-features = false, features = ["ffi"] }
