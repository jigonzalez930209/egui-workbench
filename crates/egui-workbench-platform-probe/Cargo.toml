[package]
name = "egui-workbench-platform-probe"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "platform_probe"
path = "src/main.rs"

# Standalone: examples in the root crate inherit its dev-dependencies (egui_kittest,
# criterion, wgpu), which added hours to the Windows CI compile. This crate only pulls
# the shell and the renderer it needs.
[workspace]

[dependencies]
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
egui-workbench = { path = "../..", default-features = false, features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui_kittest = { version = "0.37", features = ["wgpu"], optional = true }
egui-wgpu = { version = "0.37", default-features = false, optional = true }

[features]
wgpu = ["eframe/wgpu"]
headless = ["dep:egui_kittest", "dep:egui-wgpu"]
