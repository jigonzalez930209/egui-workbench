[package]
name = "egui-workbench-agent"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "MCP server, permissions, accessibility tree, and automation for egui-workbench."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
publish = true

[dependencies]
egui-workbench = { path = "../..", version = "1.0.1", default-features = false }
egui-workbench-host = { path = "../egui-workbench-host", version = "1.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[[bin]]
name = "egui-workbench-mcp"
path = "src/bin/egui-workbench-mcp.rs"
