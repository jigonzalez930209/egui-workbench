[package]
name = "egui-workbench-host"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A declarative host for egui-workbench: a versioned application spec, patches, events, a transport protocol, and a sidecar."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
publish = true

[features]
default = ["plot", "data"]
plot = ["egui-workbench/plot", "egui-workbench/plot3d"]
data = ["egui-workbench/viewer", "egui-workbench/csv", "egui-workbench/workbook"]

[dependencies]
egui-workbench = { path = "../..", version = "0.16.0", default-features = false, features = ["lucide-icons", "serde", "ring", "channel"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8"
egui = "0.37"
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
egui-wgpu = { version = "0.37", default-features = false }

[[bin]]
name = "egui-workbench"
path = "src/bin/egui-workbench.rs"
# The library `egui-workbench` owns the rustdoc output; the sidecar is a binary only.
doc = false
