name: Publish npm versions

# One-off: publish the npm tarballs attached to the existing releases. Remove after the
# registry has 0.16.0, 0.17.0, and 1.0.0.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Publish release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for tag in v0.16.0 v0.17.0 v1.0.0; do
            mkdir -p "$tag"
            gh release download "$tag" -p '*.tgz' -D "$tag"
            tgz=$(find "$tag" -name 'egui-workbench-*.tgz' | head -1)
            echo "publishing $tgz"
            npm publish "$(realpath "$tgz")" --access public
          done
