name: CI

# Manual only: the strict suite runs locally before a tag. This is the inexpensive
# one-OS smoke test for the rare case where a change needs a remote check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format and library tests
        run: |
          cargo fmt --all --check
          xvfb-run -a cargo test --workspace --lib
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: Security audit
        run: |
          cargo audit
          cargo deny check
      - name: Agent skill
        run: python3 docs-site/scripts/build-skill.py --check
