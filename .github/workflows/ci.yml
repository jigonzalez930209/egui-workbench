name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Style lint
        run: cargo xtask style-lint
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: Feature builds
        # A minimal build pays for no icon pack, no plot, no viewer, and no rasterizer.
        run: |
          cargo check --no-default-features
          cargo check --no-default-features --features serde
          cargo check --no-default-features --features plot
          cargo check --no-default-features --features viewer
      - name: Test
        # WGPU_DEBUG=0 comes from .cargo/config.toml (concurrent devices + debug labels
        # crash the Vulkan loader).
        run: xvfb-run -a cargo test --workspace --all-features
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run
      - name: Template
        run: cargo xtask template-check
      - name: Package
        run: cargo package --locked
      - name: Agent skill
        # references/ is generated from docs-site; the SKILL.md program and the docs'
        # complete programs must compile against this checkout.
        run: |
          python3 docs-site/scripts/build-skill.py --check
          bash docs-site/scripts/check-examples.sh

  desktop:
    # Behavior tests on the other two desktops. Pixel snapshots stay pinned to Linux;
    # this job covers the platform-sensitive chrome, input, and interaction paths.
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --workspace --lib
      - name: Behavior tests
        run: >
          cargo test --workspace
          --test app_runtime --test components --test controls --test dialogs
          --test ime_hidpi --test keybindings_editor --test layout_icons --test line_limit
          --test palette_menu --test plot --test plot_axes --test plot_charts --test plot_export
          --test plot3d --test serde_roundtrip --test session_history --test tabs --test theme_window --test title_bar
          --test tree --test viewer

  msrv:
    # The oldest Rust that `rust-version` in Cargo.toml promises (egui 0.37 needs 1.95).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
      - name: Check on the minimum supported Rust
        run: cargo +1.95 check --lib --all-features --locked

  semver:
    # Every public API change is visible in review. The baseline is the last release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A 0.x minor may break the API by design; the report is visible in the job log.
      # From 0.4 onward the baseline is the previous minor.
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        continue-on-error: true
        with:
          package: egui-workbench
          baseline-rev: v0.3.2
