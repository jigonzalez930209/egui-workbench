name: Release

# One tag-driven flow. Strict checks run locally before the tag; this workflow keeps the
# release gate small, builds each target once, and publishes every artifact from the same
# run. No push/PR workflow duplicates these builds.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test-build:
    name: test, docs, npm, crates
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            web -> target
            crates/egui-workbench-wasm -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            docs-site/package-lock.json
      - name: Version, changelog, skill
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "egui-workbench") | .version')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != Cargo.toml $version"; exit 1; }
          for name in egui-workbench-host egui-workbench-python egui-workbench-remote egui-workbench-agent egui-workbench-extensions egui-workbench-c; do
            found=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$name" '.packages[] | select(.name == $name) | .version')
            [ "v$found" = "$GITHUB_REF_NAME" ] || { echo "::error::$name $found != $GITHUB_REF_NAME"; exit 1; }
          done
          [ "v$(jq -r .version .claude-plugin/plugin.json)" = "$GITHUB_REF_NAME" ] || { echo "::error::plugin version"; exit 1; }
          [ "v$(jq -r .version crates/egui-workbench-wasm/package.json)" = "$GITHUB_REF_NAME" ] || { echo "::error::npm package version"; exit 1; }
          [ "v$(python3 -c "import tomllib; print(tomllib.load(open('crates/egui-workbench-python/pyproject.toml','rb'))['project']['version'])")" = "$GITHUB_REF_NAME" ] || { echo "::error::pyproject version"; exit 1; }
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::missing changelog"; exit 1; }
          python3 docs-site/scripts/build-skill.py --check
      - name: Basic checks
        run: |
          cargo fmt --all --check
          cargo xtask style-lint
          cargo clippy --workspace --all-targets -- -D warnings
          xvfb-run -a cargo test --workspace --lib
      - name: Docs dependencies
        working-directory: docs-site
        run: npm ci
      - name: Build docs
        working-directory: docs-site
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: |
          npm run build:demo
          npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist
      - name: Build npm package
        run: |
          cd crates/egui-workbench-wasm
          npm run build
          npm run types:check
          npm pack
      - uses: actions/upload-artifact@v7
        with:
          name: npm
          path: crates/egui-workbench-wasm/egui-workbench-*.tgz
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          publish() {
            for attempt in $(seq 1 20); do
              cargo publish "$@" --locked && return 0
              echo "waiting for $* (attempt $attempt)"
              sleep 10
            done
            return 1
          }
          publish
          publish -p egui-workbench-host
          publish -p egui-workbench-extensions
          publish -p egui-workbench-agent
          publish -p egui-workbench-remote

  linux-wheels:
    name: linux wheels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64
          manylinux: auto
          args: --release --locked --out dist --manifest-path crates/egui-workbench-python/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: aarch64
          manylinux: auto
          args: --release --locked --out dist --manifest-path crates/egui-workbench-python/Cargo.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path crates/egui-workbench-python/Cargo.toml
      - name: C ABI artifact
        run: |
          cargo build -p egui-workbench-c --release
          mkdir -p c-abi/include
          cp crates/egui-workbench-c/include/egui_workbench.h c-abi/include/
          cp target/release/libegui_workbench_c.so c-abi/
          zip -qr dist/egui-workbench-c-linux-x86_64.zip c-abi
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*

  macos-wheel:
    name: macos universal2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: universal2-apple-darwin
          args: --release --locked --out dist --manifest-path crates/egui-workbench-python/Cargo.toml
      - name: C ABI artifact
        run: |
          cargo build -p egui-workbench-c --release --locked
          mkdir -p c-abi/include
          cp crates/egui-workbench-c/include/egui_workbench.h c-abi/include/
          cp target/release/libegui_workbench_c.dylib target/release/libegui_workbench_c.a c-abi/
          zip -qr dist/egui-workbench-c-macos-aarch64.zip c-abi
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*

  windows-wheel:
    name: windows amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          target: x86_64-pc-windows-msvc
          args: --release --locked --out dist --manifest-path crates/egui-workbench-python/Cargo.toml
      - name: C ABI artifact
        shell: bash
        run: |
          cargo build -p egui-workbench-c --release --locked
          mkdir -p c-abi/include
          cp crates/egui-workbench-c/include/egui_workbench.h c-abi/include/
          cp target/release/egui_workbench_c.dll target/release/egui_workbench_c.dll.lib \
            target/release/egui_workbench_c.lib c-abi/
          7z a -tzip -bd dist/egui-workbench-c-windows-x86_64.zip c-abi > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*

  docs:
    name: deploy docs
    needs: test-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  publish:
    name: publish
    needs: [test-build, linux-wheels, macos-wheel, windows-wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Split Python distributions
        run: |
          mkdir -p python
          mv dist/*.whl dist/*.tar.gz python/
      - name: Publish Python wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: python
      - name: Publish npm package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "egui-workbench@$version" version > /dev/null 2>&1; then
            echo "egui-workbench@$version is already published"
            exit 0
          fi
          tgz=$(realpath dist/egui-workbench-*.tgz)
          npm publish "$tgz" --access public
      - name: Skill zip
        run: (cd skills && zip -qr ../egui-workbench-skill.zip egui-workbench)
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f && !/^\[[^]]*\]: /' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            egui-workbench-skill.zip python/*.whl python/*.tar.gz dist/*.tgz dist/*.zip
