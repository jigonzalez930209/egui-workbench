name: Release

# Continuous delivery: push a tag `vX.Y.Z` (matching `version` in Cargo.toml) to run the
# checks, publish egui-workbench to crates.io, and create the GitHub release with that
# version's changelog section and the agent skill (egui-workbench-skill.zip).
#
# Needs the repository secret CARGO_REGISTRY_TOKEN: a crates.io API token with the
# `publish-new` and `publish-update` scopes (crates.io → Account Settings → API Tokens).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # the GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "egui-workbench") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
          plugin=$(jq -r .version .claude-plugin/plugin.json)
          if [ "v$plugin" != "$GITHUB_REF_NAME" ]; then
            echo "::error::.claude-plugin/plugin.json version $plugin does not match $GITHUB_REF_NAME"
            exit 1
          fi
          host=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "egui-workbench-host") | .version')
          if [ "v$host" != "$GITHUB_REF_NAME" ]; then
            echo "::error::egui-workbench-host version $host does not match $GITHUB_REF_NAME"
            exit 1
          fi
          python=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "egui-workbench-python") | .version')
          if [ "v$python" != "$GITHUB_REF_NAME" ]; then
            echo "::error::egui-workbench-python version $python does not match $GITHUB_REF_NAME"
            exit 1
          fi
          remote=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "egui-workbench-remote") | .version')
          if [ "v$remote" != "$GITHUB_REF_NAME" ]; then
            echo "::error::egui-workbench-remote version $remote does not match $GITHUB_REF_NAME"
            exit 1
          fi
          agent=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "egui-workbench-agent") | .version')
          if [ "v$agent" != "$GITHUB_REF_NAME" ]; then
            echo "::error::egui-workbench-agent version $agent does not match $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Agent skill is current
        run: python3 docs-site/scripts/build-skill.py --check
      - name: Changelog has this version
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - name: Token is configured
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          [ -n "$CARGO_REGISTRY_TOKEN" ] \
            || { echo "::error::add the CARGO_REGISTRY_TOKEN repository secret"; exit 1; }
      - name: Checks
        run: xvfb-run -a cargo xtask check
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
      - name: Publish the host to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            cargo publish -p egui-workbench-host --locked && exit 0
            echo "host publish not ready (attempt $attempt); retrying"
            sleep 10
          done
          exit 1
      - name: Publish the agent to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            cargo publish -p egui-workbench-agent --locked && exit 0
            echo "agent publish not ready (attempt $attempt); retrying"
            sleep 10
          done
          exit 1
      - name: Publish the remote server to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for attempt in $(seq 1 30); do
            cargo publish -p egui-workbench-remote --locked && exit 0
            echo "remote publish not ready (attempt $attempt); retrying"
            sleep 10
          done
          exit 1
      - name: C ABI artifact
        run: |
          cargo build -p egui-workbench-c --release
          mkdir -p c-abi/include
          cp crates/egui-workbench-c/include/egui_workbench.h c-abi/include/
          cp target/release/libegui_workbench_c.so c-abi/
          zip -qr egui-workbench-c-linux-x86_64.zip c-abi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f && !/^\[[^]]*\]: /' \
            CHANGELOG.md > notes.md
          # The agent skill as a zip, for agents that install skills by upload (claude.ai).
          (cd skills && zip -qr ../egui-workbench-skill.zip egui-workbench)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag \
            egui-workbench-skill.zip egui-workbench-c-linux-x86_64.zip
