name: Benchmarks

# The criterion baseline from 0.3.x. Later releases compare against these numbers.
# Run it on a quiet machine; the default `cargo bench` profile is the reference.
on:
  workflow_dispatch:
  schedule:
    # Mondays at 04:00 UTC, so a regression shows up without a person remembering.
    - cron: "0 4 * * 1"

jobs:
  bench:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev libwayland-dev libx11-dev libxi-dev \
            libxcursor-dev libxrandr-dev libgl1-mesa-dev \
            mesa-vulkan-drivers libvulkan1 xvfb
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: Swatinem/rust-cache@v2
      - name: Run the baseline
        run: xvfb-run -a cargo bench --workspace
      - uses: actions/upload-artifact@v7
        with:
          name: criterion
          path: target/criterion
          if-no-files-found: error
