name: npm package

# Build the wasm npm package and attach the tarball to the GitHub release. Publishing to
# the npm registry needs an NPM_TOKEN secret with publish rights for `egui-workbench`;
# without it the tarball is still built and attached, and the step is skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Build the package
        run: |
          cd crates/egui-workbench-wasm
          npm run build
          npm run types:check
          npm pack
      - name: Publish to npm
        if: env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd crates/egui-workbench-wasm
          npm publish --provenance --access public
      - name: Explain a skipped npm publish
        if: env.NODE_AUTH_TOKEN == ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: echo "::warning::the npm tarball was built but not published; add the NPM_TOKEN secret"
      - name: Attach the tarball to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd crates/egui-workbench-wasm
          for _ in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" egui-workbench-*.tgz --clobber
