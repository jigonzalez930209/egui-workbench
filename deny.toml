# cargo-deny policy: advisories, licenses, bans, and sources for every crate in the
# workspace. Run with `cargo deny check`; the manual CI smoke job runs it too.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) direct dependencies, tracked in ROADMAP.md "Known gaps".
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; replacement tracked for 1.x" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml; replacement tracked for 1.x" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
