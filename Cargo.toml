[package]
name = "egui-workbench"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "A desktop workbench shell for egui: themes, custom title bar, menus, tabs, explorer tree, dialogs, command palette, toasts, interactive plots, and a shadcn-style component layer."
readme = "README.md"
repository = "https://github.com/jigonzalez930209/egui-workbench"
homepage = "https://jigonzalez930209.github.io/egui-workbench/"
documentation = "https://docs.rs/egui-workbench"
keywords = ["egui", "gui", "desktop", "workbench", "widgets"]
categories = ["gui"]
# Only the library and its embedded icons; examples, tests, and the docs site stay in git.
include = ["/src/**", "/assets/**", "/locales/**", "/README.md", "/CHANGELOG.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[package.metadata.docs.rs]
all-features = true
# Show which items need `material-icons` / `lucide-icons`.
rustdoc-args = ["--cfg", "docsrs"]

[workspace]
members = ["xtask", "crates/egui-workbench-host", "crates/egui-workbench-python", "crates/egui-workbench-remote", "crates/egui-workbench-c", "crates/egui-workbench-agent", "crates/egui-workbench-extensions"]
resolver = "3"

[features]
default = [
    "material-icons",
    "lucide-icons",
    "plot",
    "plot3d",
    "viewer",
    "serde",
    "csv",
    "workbook",
    "ring",
    "channel",
]
# Rasterize SVG glyphs. Icon packs and the plot exporter need it; a build with no icon
# packs and no plot pays neither `resvg` nor `usvg`.
svg = ["dep:resvg", "dep:usvg"]
# The VS Code Material Icon Theme (MIT, ~5 MB of SVG) for file and folder icons.
material-icons = ["svg", "dep:serde", "dep:serde_json"]
# The Lucide icon set (ISC, ~1 MB of SVG) available by name to every component.
lucide-icons = ["svg"]
# `Plot`, chart families, legend animations, and SVG/PNG export.
plot = ["svg"]
# `Plot3D` and `Series3D`; implies `plot`.
plot3d = ["plot"]
# The read-only workbook and delimited-file viewer.
viewer = ["dep:calamine", "viewer-formats"]
# JSON/YAML/TOML trees, Markdown, and PNG/JPEG in the viewer registry.
viewer-formats = ["dep:serde_json", "dep:serde_yaml", "dep:toml", "dep:pulldown-cmark", "dep:image"]
# Delimited data connector.
csv = []
# Spreadsheet connector through `calamine`.
workbook = ["viewer"]
# In-memory ring buffer connector.
ring = []
# Channel/socket/serial adapter.
channel = []
# Arrow IPC connector.
arrow = ["dep:arrow"]
# Parquet connector (Arrow-backed).
parquet = ["dep:parquet", "arrow", "dep:bytes"]
# SQLite connector.
sqlite = ["dep:rusqlite"]
# Serializable component state and the stable event model.
serde = ["dep:serde", "dep:serde_json", "egui/serde"]
# GPU line/marker renderer through egui_wgpu paint callbacks.
gpu = ["plot", "dep:egui-wgpu", "dep:bytemuck"]

[dependencies]
# Caret ranges: applications may pick any 0.37.x / 0.48.x patch release.
egui = "0.37"
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts", "clipboard"] }
resvg = { version = "0.48", optional = true }
usvg = { version = "0.48", optional = true }
rust-embed = "8"
calamine = { version = "0.38", default-features = false, optional = true }
serde = { version = "1", features = ["derive", "rc"], optional = true }
serde_json = { version = "1", optional = true }
arrow = { version = "60", optional = true, default-features = false, features = ["ipc"] }
parquet = { version = "60", optional = true, default-features = false, features = ["arrow", "snap", "flate2-zlib-rs"] }
bytes = { version = "1", optional = true }
rusqlite = { version = "0.32", optional = true, features = ["bundled"] }
serde_yaml = { version = "0.9", optional = true }
toml = { version = "0.8", optional = true }
pulldown-cmark = { version = "0.13", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg"] }
egui-wgpu = { version = "0.37", optional = true, default-features = false }
bytemuck = { version = "1", features = ["derive"], optional = true }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
criterion = "0.5"

[[bench]]
name = "plot_decimation"
harness = false

[[bench]]
name = "large_tree"
harness = false

[[bench]]
name = "csv"
harness = false

[[bench]]
name = "palette_filter"
harness = false
